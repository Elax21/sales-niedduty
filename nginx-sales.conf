# /etc/nginx/sites-available/sales.niedduty.de  (danach: certbot --nginx -d sales.niedduty.de)
server {
    listen 80;
    listen [::]:80;
    server_name sales.niedduty.de;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sales.niedduty.de;

    ssl_certificate     /etc/letsencrypt/live/sales.niedduty.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sales.niedduty.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 1m;

    # Anmeldung zusätzlich in nginx bremsen
    location = /api/login {
        limit_req zone=niedduty_anfrage burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
